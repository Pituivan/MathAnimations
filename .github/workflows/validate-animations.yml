name: Validate animations

on:
  push:
    paths:
      - 'animations/**/*.py'
      - 'utils/**/*.py'
  pull_request:
    paths:
      - 'animations/**/*.py'
      - 'utils/**/*.py'

jobs:
  validate-scenes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Manim and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            pkg-config \
            build-essential \
            python3-dev \
            libcairo2-dev \
            libpango1.0-dev \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science

          pip install -e .

      - name: Check for changes in utils
        id: utils-changes
        uses: tj-actions/changed-files@v45
        with:
          files: |
            utils/**/*.py

      - name: Get changed animations files
        id: animations-changes
        if: steps.utils-changes.outputs.any_changed == 'false'
        uses: tj-actions/changed-files@v45
        with:
          files: |
            animations/**/*.py

      - name: Validate modified animations
        if: steps.utils-changes.outputs.any_changed == 'false'
        run: |
          for file in ${{ steps.animations-changes.outputs.added_files }} \
                      ${{ steps.animations-changes.outputs.modified_files }} \
                      ${{ steps.animations-changes.outputs.renamed_files }}
          do
            scene=$(basename "$file" .py)
            manim "$file" "$scene" --dry_run
          done

      - name: Validate all animations
        if: steps.utils-changes.outputs.any_changed == 'true'
        run: |
          for file in animations/**/*.py; do
            scene=$(basename "$file" .py)
            manim "$file" "$scene" --dry_run
          done