name: Validate animations

on:
  push:
    paths:
      - 'animations/**/*.py'
  pull_request:
    paths:
      - 'animations/**/*.py'

jobs:
  validate-scenes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Manim and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            pkg-config \
            build-essential \
            python3-dev \
            libcairo2-dev \
            libpango1.0-dev \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get changed animations files
        id: changes
        uses: tj-actions/changed-files@v45
        with:
          files: |
            animations/**/*.py

      - name: Validate modified scenes
        run: |
          for file in ${{ steps.changes.outputs.added_files }} \
                      ${{ steps.changes.outputs.modified_files }} \
                      ${{ steps.changes.outputs.renamed_files }}
          do
            scene=$(basename "$file" .py)
            manim "$file" "$scene" --dry_run
          done